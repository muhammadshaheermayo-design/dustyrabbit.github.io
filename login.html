<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DustyRabbit Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{

    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:linear-gradient(135deg,#0f172a,#1e1b4b,#111827);

    overflow:hidden;
}

/* LOGIN BOX */

.login-box{

    width:380px;

    background:rgba(255,255,255,0.08);

    border:1px solid rgba(255,255,255,0.1);

    backdrop-filter:blur(12px);

    padding:40px;

    border-radius:25px;

    text-align:center;

    color:white;

    animation:popup 1s ease;
}

/* RABBIT */

.rabbit{

    font-size:90px;

    margin-bottom:10px;

    animation:rabbitJump 2s infinite;
}

/* TITLE */

.login-box h1{

    margin-bottom:25px;

    color:#f472b6;
}

/* INPUTS */

.input-box{

    width:100%;

    padding:14px;

    margin-top:15px;

    border:none;

    outline:none;

    border-radius:12px;

    background:rgba(255,255,255,0.12);

    color:white;

    font-size:16px;
}

.input-box::placeholder{
    color:#d1d5db;
}

/* BUTTON */

button{

    width:100%;

    padding:14px;

    margin-top:22px;

    border:none;

    border-radius:12px;

    background:#ec4899;

    color:white;

    font-size:18px;

    cursor:pointer;

    transition:0.3s;
}

button:hover{

    transform:scale(1.05);

    background:#db2777;
}

/* MESSAGE */

#message{

    margin-top:18px;

    color:#86efac;

    font-size:15px;
}

/* ANIMATIONS */

@keyframes popup{

    0%{
        transform:scale(0);
        opacity:0;
    }

    100%{
        transform:scale(1);
        opacity:1;
    }

}

@keyframes rabbitJump{

    0%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-10px);
    }

    100%{
        transform:translateY(0);
    }

}

</style>
</head>

<body>

<div class="login-box">

    <div class="rabbit">🐰</div>

    <h1>DustyRabbit Login</h1>

    <input type="text" id="username" class="input-box" placeholder="Username">

    <input type="email" id="email" class="input-box" placeholder="Email">

    <input type="password" id="password" class="input-box" placeholder="Password">

    <button onclick="registerUser()">Create Account</button>

    <p id="message"></p>

</div>

<script>

function registerUser(){

    let username = document.getElementById("username").value;

    let email = document.getElementById("email").value;

    let password = document.getElementById("password").value;

    if(username == "" || email == "" || password == ""){

        document.getElementById("message").innerHTML = "Fill all fields";

        return;
    }

    localStorage.setItem("username",username);

    localStorage.setItem("email",email);

    localStorage.setItem("password",password);

    document.getElementById("message").innerHTML = "Account Created Successfully 🐰";
}

</script>

</body>
</html>
