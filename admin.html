<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DustyRabbit Admin</title>

<style>

body{

  background:#111827;

  color:white;

  font-family:Arial;

  padding:40px;
}

.admin-box{

  background:#1f2937;

  padding:30px;

  border-radius:20px;

  max-width:500px;

  margin:auto;
}

h1{

  text-align:center;

  color:#f472b6;

  margin-bottom:20px;
}

input{

  width:100%;

  padding:12px;

  margin-top:15px;

  border:none;

  border-radius:10px;
}

button{

  width:100%;

  padding:12px;

  margin-top:20px;

  border:none;

  border-radius:10px;

  background:#ec4899;

  color:white;

  font-size:18px;

  cursor:pointer;
}

.preview{

  margin-top:40px;

  text-align:center;
}

.preview img{

  width:100%;

  border-radius:20px;
}

</style>

</head>

<body>

<div class="admin-box">

<h1>🐰 Admin Upload</h1>

<input type="file" id="imageInput">

<input type="text" id="titleInput" placeholder="Photo Title">

<button onclick="uploadPhoto()">
Upload
</button>

<div class="preview" id="preview"></div>

</div>

<script>

function uploadPhoto(){

  let file = document.getElementById("imageInput").files[0];

  let title = document.getElementById("titleInput").value;

  if(!file){

    alert("Select image");

    return;
  }

  let imageURL = URL.createObjectURL(file);

  document.getElementById("preview").innerHTML = `

    <h2>${title}</h2>

    <img src="${imageURL}">

  `;
}

</script>

</body>

</html>
