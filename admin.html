<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<section class="hero">

<h1>🐰 Admin Upload</h1>

<p>Add GIFs easily</p>

</section>

<div style="max-width:500px;margin:auto;padding:20px;">

<input
type="text"
id="gifTitle"
placeholder="GIF Title"
class="input-box">

<input
type="text"
id="gifURL"
placeholder="GIF URL or gifs/file.gif"
class="input-box">

<button
class="login-button"
onclick="addGIF()">

Add GIF

</button>

</div>

<script>

function addGIF(){

  let title =
  document.getElementById("gifTitle").value;

  let url =
  document.getElementById("gifURL").value;

  let gifs =
  JSON.parse(localStorage.getItem("gifs")) || [];

  gifs.push({

    title:title,
    url:url

  });

  localStorage.setItem("gifs",JSON.stringify(gifs));

  alert("GIF Added");

}

</script>

</body>

</html>
