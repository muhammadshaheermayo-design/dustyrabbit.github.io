<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DustyRabbit</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- AGE POPUP -->

<div class="age-popup" id="popup">

  <div class="popup-box">

    <div class="big-rabbit">🐰</div>

    <h2>Are you 18 or older?</h2>

    <button onclick="enterSite()">Enter</button>

  </div>

</div>

<!-- LOGIN POPUP -->

<div class="login-popup" id="loginPopup">

  <div class="login-box">

    <button class="close-btn" onclick="closeLogin()">✖</button>

    <div class="rabbit-login">🐰</div>

    <h1>DustyRabbit Login</h1>

    <input type="text" placeholder="Username" class="input-box">

    <input type="email" placeholder="Email" class="input-box">

    <input type="password" placeholder="Password" class="input-box">

    <button class="login-button">Login</button>

  </div>

</div>

<header>

  <div class="left-side">

    <!-- LOGIN BUTTON FOR POPUP -->

    <button class="open-login" onclick="openLogin()">Login</button>

    <div class="logo">🐰 DustyRabbit</div>

  </div>

  <nav>
    <a href="index.html">Home</a>
    <a href="gifs.html">GIFs</a>
    <a href="photos.html">Photos</a>
    <a href="sounds.html">Sounds</a>
    <a href="about.html">About</a>
  </nav>

</header>

<section class="hero">

  <h1>Welcome to DustyRabbit</h1>

  <p>Download GIFs, Photos and Meme Sounds</p>

</section>

<section class="cards">

  <div class="card">
    <h2>GIFs</h2>
    <p>Funny animated memes</p>
    <a href="gifs.html">Open</a>
  </div>

  <div class="card">
    <h2>Photos</h2>
    <p>Trending meme images</p>
    <a href="photos.html">Open</a>
  </div>

  <div class="card">
    <h2>Sounds</h2>
    <p>Meme audio clips</p>
    <a href="sounds.html">Open</a>
  </div>

</section>

<footer>
  © 2026 DustyRabbit
</footer>

<script>

function enterSite(){

  document.getElementById("popup").style.display = "none";

}

/* OPEN LOGIN POPUP */

function openLogin(){

  document.getElementById("loginPopup").style.display = "flex";

}

/* CLOSE LOGIN POPUP */

function closeLogin(){

  document.getElementById("loginPopup").style.display = "none";

}

</script>

</body>
</html>
